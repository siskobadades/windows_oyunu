<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>HTML Windows Masaüstü</title>
<style>
body {
  background-color: teal;
  font-family: sans-serif;
  margin: 0;
}
#desktop {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.icon {
  display: inline-block;
  margin: 10px;
  text-align: center;
  color: white;
  cursor: pointer;
}
.window {
  position: absolute;
  top: 100px;
  left: 100px;
  width: 600px;
  height: 400px;
  background: #fff;
  border: 2px solid #000;
  box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
}
.titlebar {
  background: #333;
  color: white;
  padding: 5px;
  cursor: move;
}
iframe {
  width: 100%;
  height: calc(100% - 30px);
  border: none;
}
#taskbar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: black;
  color: white;
  padding: 5px;
}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" onclick="openBrowser('Google','https://www.google.com')">🌐<br>Google</div>
  <div class="icon" onclick="openBrowser('YouTube','https://www.youtube.com')">📺<br>YouTube</div>
  <div class="icon" onclick="toggleInternet()">🔌<br>İnternet Aç/Kapat</div>
  <div class="icon">📝<br>Not Defteri</div>
  <div class="icon">⚙️<br>Ayarlar</div>
  <div class="icon">🎮<br>Mini Oyun</div>
  <div class="icon">🎵<br>Müzik Çalar</div>
  <div class="icon">📁<br>Dosya Gezgini</div>
  <div id="taskbar">Başlat</div>
</div>

<script>
let internet=true; // başlangıçta internet açık

function toggleInternet(){
  internet=!internet;
  alert(internet ? "İnternet bağlandı!" : "İnternet kesildi!");
}

function openBrowser(title,url){
  let win=document.createElement("div");
  win.className="window";
  win.innerHTML=`
    <div class='titlebar'>${title}</div>
    <iframe id="webview"></iframe>
  `;
  document.body.appendChild(win);

  // internet kontrolü
  if(internet){
    win.querySelector("#webview").src=url;
  } else {
    win.querySelector("#webview").srcdoc="<h2 style='text-align:center;color:red;'>İnternet yok!</h2>";
  }

  // pencereyi sürükleme
  const titleBar=win.querySelector(".titlebar");
  let offsetX=0, offsetY=0, dragging=false;
  titleBar.addEventListener("mousedown", e=>{
    dragging=true;
    offsetX=e.clientX-win.offsetLeft;
    offsetY=e.clientY-win.offsetTop;
  });
  document.addEventListener("mouseup", ()=>dragging=false);
  document.addEventListener("mousemove", e=>{
    if(dragging){
      win.style.left=(e.clientX-offsetX)+"px";
      win.style.top=(e.clientY-offsetY)+"px";
    }
  });
}
</script>
</body>
</html>
