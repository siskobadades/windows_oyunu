<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PC Simülasyonu</title>
<style>
  body {margin:0; background:#222; font-family:Arial; color:#fff;}
  .desktop {display:flex; flex-wrap:wrap; padding:20px;}
  .icon {width:100px; text-align:center; margin:15px; cursor:pointer; background:#444; border-radius:10px; padding:10px;}
  .window {position:absolute; top:50px; left:50px; width:600px; height:400px; background:#fff; color:#000; border:2px solid #000; overflow:auto;}
  .titlebar {background:#333; color:#fff; padding:5px; display:flex; justify-content:space-between;}
</style>
</head>
<body>

<div class="desktop">
  <div class="icon" onclick="openApp('google')">🌐<br>Google</div>
  <div class="icon" onclick="openApp('snapchat')">👻<br>Snapchat</div>
  <div class="icon" onclick="openApp('youtube')">📺<br>YouTube</div>
  <div class="icon" onclick="openApp('facebook')">📘<br>Facebook</div>
  <div class="icon" onclick="openApp('instagram')">📸<br>Instagram</div>
  <div class="icon" onclick="openApp('tiktok')">🎵<br>TikTok</div>
  <div class="icon" onclick="openApp('duolingo')">🦉<br>Duolingo</div>
  <div class="icon" onclick="openApp('camera')">📷<br>Kamera</div>
  <div class="icon" onclick="openApp('copilot')">🤖<br>Copilot</div>
  <div class="icon" onclick="openApp('charge')">🔌<br>Şarj</div>
</div>

<script>
let windows=[];
let camStream=null;
const NOKIA_SRC="https://www.youtube.com/embed/2Z4m4lnjxkY";

function openApp(app){
  let win=document.createElement("div");
  win.className="window";
  win.innerHTML=`<div class="titlebar">${app} <button onclick="closeWin(this)">X</button></div>`;

  if(app==="google"){
    win.innerHTML+=`
      <h2>Google</h2>
      <input id="gAra" placeholder="Google'da ara" style="width:80%; padding:8px;">
      <button onclick="googleAra(this)">Ara</button>
      <div id="gSonuc"></div>
    `;
  }
  if(app==="snapchat"){win.innerHTML+=`<p>Snapchat simülasyonu</p>`;}
  if(app==="youtube"){win.innerHTML+=`<iframe width="100%" height="300" src="${NOKIA_SRC}" allowfullscreen></iframe>`;}
  if(app==="facebook"){win.innerHTML+=`<iframe width="100%" height="300" src="${NOKIA_SRC}" allowfullscreen></iframe>`;}
  if(app==="instagram"){win.innerHTML+=`<iframe width="100%" height="300" src="${NOKIA_SRC}" allowfullscreen></iframe>`;}
  if(app==="tiktok"){win.innerHTML+=`<iframe width="100%" height="300" src="${NOKIA_SRC}" allowfullscreen></iframe>`;}
  if(app==="duolingo"){win.innerHTML+=`<iframe width="100%" height="300" src="${NOKIA_SRC}" allowfullscreen></iframe>`;}
  if(app==="camera"){
    win.innerHTML+=`
      <h2>Kamera</h2>
      <button onclick='startCam("user")'>Ön Kamera</button>
      <button onclick='startCam("environment")'>Arka Kamera</button><br>
      <video id="cam" autoplay playsinline width="100%" height="300"></video>
    `;
  }
  if(app==="copilot"){win.innerHTML+=`<p>Copilot: Adını yaz <input id="ad"><button onclick="selamVer()">Gönder</button><div id="selam"></div></p>`;}
  if(app==="charge"){win.innerHTML+=`<p>Şarj oluyor... ⚡</p>`;}

  document.body.appendChild(win);
  windows.push(win);
}

function closeWin(btn){
  let win=btn.parentElement.parentElement;
  // Kamera penceresi kapanıyorsa stream'i durdur
  if(win.querySelector("#cam") && camStream){
    camStream.getTracks().forEach(t=>t.stop());
    camStream=null;
  }
  win.remove();
}

function googleAra(btn){
  let q=document.getElementById("gAra").value;
  let parent=btn.parentElement;
  parent.innerHTML=`<iframe src="https://www.google.com/search?q=${encodeURIComponent(q)}" style="width:100%; height:350px; border:none;"></iframe>`;
}

function selamVer(){
  let ad=document.getElementById("ad").value;
  document.getElementById("selam").innerText="Merhaba "+ad+" 👋";
}

function startCam(facing){
  navigator.mediaDevices.getUserMedia({video:{facingMode:facing}})
  .then(stream=>{
    camStream=stream;
    document.getElementById("cam").srcObject=stream;
  })
  .catch(err=>alert("Kamera hatası: "+err));
}
</script>
</body>
</html>
