<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>HTML Windows Masaüstü</title>
<style>
body {
  background-color: teal;
  font-family: sans-serif;
  margin: 0;
}
#desktop {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.icon {
  display: inline-block;
  margin: 10px;
  text-align: center;
  color: white;
  cursor: pointer;
}
.window {
  position: absolute;
  top: 100px;
  left: 100px;
  width: 600px;
  height: 400px;
  background: #fff;
  border: 2px solid #000;
  box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
}
.titlebar {
  background: #333;
  color: white;
  padding: 5px;
  cursor: move;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.closeBtn {
  background: red;
  color: white;
  border: none;
  cursor: pointer;
  padding: 2px 8px;
}
iframe {
  width: 100%;
  height: calc(100% - 30px);
  border: none;
}
#taskbar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: black;
  color: white;
  padding: 5px;
  display: flex;
  justify-content: space-between;
}
#shutdownBtn {
  background: crimson;
  color: white;
  border: none;
  cursor: pointer;
  padding: 5px 10px;
}
#shutdownScreen {
  display:none;
  background:black;
  color:red;
  font-size:40px;
  text-align:center;
  padding-top:20%;
  height:100vh;
}
video {
  width: 100%;
  height: calc(100% - 30px);
  background: black;
}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" onclick="openBrowser('Google','https://www.google.com')">🌐<br>Google</div>
  <div class="icon" onclick="openBrowser('YouTube','https://www.youtube.com')">📺<br>YouTube</div>
  <div class="icon" onclick="toggleInternet()">🔌<br>İnternet Aç/Kapat</div>
  <div class="icon" onclick="openApp('Not Defteri','<textarea style=\'width:100%;height:100%;\'></textarea>')">📝<br>Not Defteri</div>
  <div class="icon" onclick="openApp('Ayarlar','<button onclick=&quot;document.body.style.background=\'black\'&quot;>Tema Siyah</button>')">⚙️<br>Ayarlar</div>
  <div class="icon" onclick="openApp('Mini Oyun','<p style=\'text-align:center;\'>Buraya oyun gelecek 🎮</p>')">🎮<br>Mini Oyun</div>
  <div class="icon" onclick="openApp('Müzik Çalar','<audio controls><source src=\'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3\' type=\'audio/mpeg\'></audio>')">🎵<br>Müzik Çalar</div>
  <div class="icon" onclick="openApp('Dosya Gezgini','<ul><li>Dosya1.txt</li><li>Resim.png</li><li>Video.mp4</li></ul>')">📁<br>Dosya Gezgini</div>
  <div class="icon" onclick="openCamera()">📷<br>Kamera</div>
  <div id="taskbar">
    <span>Başlat</span>
    <button id="shutdownBtn" onclick="shutdownPC()">PC Kapat</button>
  </div>
</div>

<div id="shutdownScreen">💻 PC Kapatıldı<br><br>Kullanıcı: Uras<br><br><span style="font-size:20px;">Boşluk tuşuna basarak açabilirsiniz...</span></div>

<script>
let internet=true; // başlangıçta internet açık
let cameraStream=null;

function toggleInternet(){
  internet=!internet;
  alert(internet ? "İnternet bağlandı!" : "İnternet kesildi!");
}

function openBrowser(title,url){
  let win=document.createElement("div");
  win.className="window";
  win.innerHTML=`
    <div class='titlebar'>
      ${title}
      <button class='closeBtn'>X</button>
    </div>
    <iframe id="webview"></iframe>
  `;
  document.body.appendChild(win);

  if(internet){
    win.querySelector("#webview").src=url;
  } else {
    win.querySelector("#webview").srcdoc="<h2 style='text-align:center;color:red;'>İnternet yok!</h2>";
  }

  makeDraggable(win);
  win.querySelector(".closeBtn").addEventListener("click", ()=>win.remove());
}

function openApp(title,content){
  let win=document.createElement("div");
  win.className="window";
  win.innerHTML=`
    <div class='titlebar'>
      ${title}
      <button class='closeBtn'>X</button>
    </div>
    <div style="height:calc(100% - 30px);overflow:auto;">${content}</div>
  `;
  document.body.appendChild(win);

  makeDraggable(win);
  win.querySelector(".closeBtn").addEventListener("click", ()=>win.remove());
}

function openCamera(){
  let win=document.createElement("div");
  win.className="window";
  win.innerHTML=`
    <div class='titlebar'>
      Kamera
      <button class='closeBtn'>X</button>
    </div>
    <video id="cameraView" autoplay></video>
  `;
  document.body.appendChild(win);

  makeDraggable(win);

  // Kamera aç
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream=>{
      cameraStream=stream;
      win.querySelector("#cameraView").srcObject=stream;
    })
    .catch(err=>{
      win.querySelector("#cameraView").outerHTML="<p style='color:red;text-align:center;'>Kamera erişimi reddedildi!</p>";
    });

  // Kapatınca kamera durdur
  win.querySelector(".closeBtn").addEventListener("click", ()=>{
    if(cameraStream){
      cameraStream.getTracks().forEach(track=>track.stop());
      cameraStream=null;
    }
    win.remove();
  });
}

function makeDraggable(win){
  const titleBar=win.querySelector(".titlebar");
  let offsetX=0, offsetY=0, dragging=false;
  titleBar.addEventListener("mousedown", e=>{
    if(e.target.classList.contains("closeBtn")) return;
    dragging=true;
    offsetX=e.clientX-win.offsetLeft;
    offsetY=e.clientY-win.offsetTop;
  });
  document.addEventListener("mouseup", ()=>dragging=false);
  document.addEventListener("mousemove", e=>{
    if(dragging){
      win.style.left=(e.clientX-offsetX)+"px";
      win.style.top=(e.clientY-offsetY)+"px";
    }
  });
}

function shutdownPC(){
  document.getElementById("desktop").style.display="none";
  document.getElementById("shutdownScreen").style.display="block";
  // PC kapanınca kamera da kapansın
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=null;
  }
}

// Boşluk tuşuna basınca PC açılır
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && document.getElementById("shutdownScreen").style.display==="block"){
    document.getElementById("shutdownScreen").style.display="none";
    document.getElementById("desktop").style.display="block";
  }
});
</script>
</body>
</html>
