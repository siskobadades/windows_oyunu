<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>oyunwindows</title>
<style>
body{background:teal;font-family:sans-serif;margin:0}
#desktop{position:relative;width:100%;height:100vh;overflow:hidden}
.icon{display:inline-block;margin:10px;text-align:center;color:white;cursor:pointer;font-size:14px;width:80px}
.window{position:absolute;top:100px;left:100px;width:600px;height:400px;background:#fff;border:2px solid #000;box-shadow:4px 4px 10px rgba(0,0,0,.4)}
.titlebar{background:#333;color:white;padding:5px;cursor:move;display:flex;justify-content:space-between}
.close{cursor:pointer}
iframe{width:100%;height:calc(100% - 30px);border:none}
#taskbar{position:absolute;bottom:0;left:0;width:100%;background:black;color:white;padding:5px;display:flex;gap:10px}
</style>
</head>
<body>
<div id="desktop">
  <div class="icon" onclick="openWindow('Google','https://www.google.com')">🌐<br>Google</div>
  <div class="icon" onclick="openWindow('YouTube','https://www.youtube.com')">📺<br>YouTube</div>
  <div class="icon" onclick="openWindow('Not Defteri','')">📝<br>Not Defteri</div>
  <div class="icon">⚙️<br>Ayarlar</div>
  <div class="icon">🎮<br>Mini Oyun</div>
  <div class="icon">🎵<br>Müzik Çalar</div>
  <div class="icon">📁<br>Dosya Gezgini</div>
  <div id="taskbar"><button>Başlat</button></div>
</div>
<script>
function openWindow(title,url){
  let win=document.createElement("div");
  win.className="window";
  win.style.top = 100 + Math.random()*50 + "px";
  win.style.left = 100 + Math.random()*50 + "px";
  win.innerHTML=`<div class='titlebar'>${title} <span class='close' onclick="this.parentElement.parentElement.remove()">X</span></div><iframe src='${url}'></iframe>`;
  document.body.appendChild(win);
}
</script>
</body>
</html>
